[project]
name = "projekt-rechenrally"
version = "0.1.0"
description = "Elementary school math exercise sheet generator (SVG/PDF)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.8",
    "connexion[uvicorn,swagger-ui]>=3.0",
    "fastapi>=0.162.0",
    "inkex>=1.4.1",
    "lxml>=5.3.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
math-trainer = "math_trainer:cli"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "httpx>=0.28.1",
    "lxml-stubs>=0.5.1",
    "mypy>=2.4.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "exercises*", "svg*", "cli*", "server*"]

[tool.setuptools]
py-modules = ["math_trainer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["inkex.*", "connexion"]
ignore_missing_imports = true

