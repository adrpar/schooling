[project]
name = "projekt-rechenrally"
version = "0.1.0"
description = "Elementary school math exercise sheet generator (SVG/PDF)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.8",
    "inkex>=1.4.1",
    "lxml>=5.3.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "exercises*", "svg*", "cli*"]
